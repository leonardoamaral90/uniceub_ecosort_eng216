services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: ecosort-zookeeper
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 12

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: ecosort-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
    - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
    - KAFKA_LISTENERS=PLAINTEXT://:9092,EXTERNAL://:29092
    - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
    - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
    - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
    - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
    - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: ecosort-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-ecosort}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-ecosort123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: ecosort-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-ecosort} ${MINIO_SECRET_KEY:-ecosort123};
      mc mb -p local/${MINIO_BUCKET_BRONZE:-bronze} || true;
      mc mb -p local/${MINIO_BUCKET_SILVER:-silver} || true;
      mc mb -p local/${MINIO_BUCKET_GOLD:-gold} || true;
      mc anonymous set download local/${MINIO_BUCKET_GOLD:-gold} || true;
      echo 'MinIO buckets prontos.';
      "

  prefect-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecosort-prefect-server
    command: >
      bash -c "mkdir -p /data/prefect && prefect server start --host 0.0.0.0 --port 4200"
    environment:
      - PREFECT_API_DATABASE_CONNECTION_URL=sqlite+aiosqlite:////data/prefect/prefect.db
    ports:
      - "4200:4200"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "python /app/scripts/wait_for_tcp.py localhost 4200 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecosort-pipeline
    depends_on:
      minio-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      prefect-server:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app/src
    volumes:
      - ./data:/data
      - ./kaggle:/root/.kaggle:ro
    command: /app/scripts/run_pipeline.sh
    restart: "no"

  ge-docs:
    image: nginx:1.27-alpine
    container_name: ecosort-ge-docs
    depends_on:
      pipeline:
        condition: service_completed_successfully
    ports:
      - "8088:80"
    volumes:
      - ./data/lakehouse/great_expectations/data_docs:/usr/share/nginx/html:ro
    restart: unless-stopped

  metabase:
    build:
      context: ./metabase
      dockerfile: Dockerfile
    container_name: ecosort-metabase
    depends_on:
      pipeline:
        condition: service_completed_successfully
    environment:
      - MB_PLUGINS_DIR=/plugins
      - MB_DB_FILE=/metabase-data/metabase.db
    ports:
      - "3000:3000"
    volumes:
      - metabase-data:/metabase-data
      - ./data/duckdb:/data/duckdb:ro
    restart: unless-stopped

  kafka-producer:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["streaming"]
    depends_on:
      kafka:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app/src
    volumes:
      - ./data:/data
      - ./kaggle:/root/.kaggle:ro
    command: python -m ecosort.ingestion.kafka_producer --continuous

  kafka-consumer:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["streaming"]
    depends_on:
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app/src
    volumes:
      - ./data:/data
      - ./kaggle:/root/.kaggle:ro
    command: python -m ecosort.ingestion.kafka_consumer --continuous

volumes:
  minio-data:
  metabase-data:
